<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocation · Choose a version</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312343c'/%3E%3Cpath d='M8 15.5 16 8l8 7.5V24H8Z' fill='none' stroke='%23e4c27a' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      align-items: end;
      color: #f4efe4;
      font-family: Outfit, "Segoe UI", sans-serif;
      background: #0c2228 url("media/hero.jpg") center 40% / cover no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(to top, rgba(8, 20, 24, 0.92), rgba(8, 20, 24, 0.28) 55%);
    }
    main {
      position: relative;
      width: min(760px, calc(100% - 2rem));
      margin: 0 auto 3rem;
    }
    p { margin: 0; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.78rem; color: #e4c27a; font-weight: 600; }
    h1 {
      margin: 0.4rem 0 0.4rem;
      font-family: Fraunces, Georgia, serif;
      font-weight: 520;
      font-size: clamp(3.4rem, 8vw, 5.5rem);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .note { letter-spacing: 0; text-transform: none; font-size: 1.05rem; font-weight: 400; color: #f4efe4; margin: 0 0 1.3rem; }
    .choices { display: grid; gap: 0.8rem; }
    a {
      display: block;
      text-decoration: none;
      color: #10262c;
      background: #fffaf3;
      border-radius: 16px;
      padding: 1rem 1.1rem;
    }
    a strong { display: block; font-size: 1.15rem; }
    a span { display: block; margin-top: 0.2rem; color: #5c675f; }
    a:focus-visible { outline: 2px solid #e4c27a; outline-offset: 3px; }
    @media (min-width: 700px) {
      .choices { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p>2026 Fall Vision Series</p>
    <h1>Vocation</h1>
    <p class="note">Two copies of the October 4 group guide.</p>
    <div class="choices">
      <a href="v1.html">
        <strong>v1</strong>
        <span>One player for each passage. Press play and the verses follow in order.</span>
      </a>
      <a href="v2.html">
        <strong>v2</strong>
        <span>A separate video for every verse: Daniel 6:1–4 and Colossians 3:23–24.</span>
      </a>
    </div>
  </main>
</body>
</html>
